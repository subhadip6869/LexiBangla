name: Build and Package LexiBangla Desktop

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clean platform-specific JVM config on non-Windows
        if: runner.os != 'Windows'
        run: |
          if [ -f .mvn/jvm.config ]; then
            sed -i '/WINDOWS-ROOT/d' .mvn/jvm.config || rm -f .mvn/jvm.config
          fi

      - name: Run Maven Tests
        run: mvn test --batch-mode

  package-multi-os:
    name: Package Optimized Native Binary (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg-type: exe
            artifact-name: LexiBangla-Windows
            installer-glob: dist/*.exe
          - os: ubuntu-latest
            pkg-type: deb
            artifact-name: LexiBangla-Linux
            installer-glob: dist/*.deb
          - os: macos-latest
            pkg-type: dmg
            artifact-name: LexiBangla-macOS
            installer-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clean platform-specific JVM config on non-Windows
        if: runner.os != 'Windows'
        run: |
          if [ -f .mvn/jvm.config ]; then
            sed -i '/WINDOWS-ROOT/d' .mvn/jvm.config || rm -f .mvn/jvm.config
          fi

      - name: Build Fat JAR
        run: mvn clean package -DskipTests --batch-mode

      - name: Build Optimized Bundled JRE with jlink
        run: jlink --no-header-files --no-man-pages --strip-debug --compress=2 --add-modules java.base,java.compiler,java.desktop,java.instrument,java.naming,java.net.http,java.rmi,java.scripting,java.sql,java.xml,jdk.crypto.ec,jdk.localedata,jdk.unsupported --output target/custom-runtime

      - name: Package Native Installer with jpackage (Windows EXE)
        if: runner.os == 'Windows'
        run: |
          mkdir -Force dist
          $jar = (Get-ChildItem target/lexibangla-*-all.jar | Select-Object -First 1).Name
          $packageInput = "target\package-input"
          if (Test-Path $packageInput) { Remove-Item -Recurse -Force $packageInput }
          New-Item -ItemType Directory -Path $packageInput | Out-Null
          Copy-Item "target\$jar" -Destination $packageInput
          $jpackageArgs = @(
            "--type", "exe",
            "--dest", "dist",
            "--name", "LexiBangla",
            "--app-version", "1.0.0",
            "--vendor", "OriginSD",
            "--copyright", "© 2026 OriginSD",
            "--description", "English-to-Bengali Offline Dictionary",
            "--icon", "src/main/resources/lexibangla-logo.ico",
            "--input", $packageInput,
            "--main-jar", $jar,
            "--main-class", "org.originsd.lexibangla.Launcher",
            "--runtime-image", "target/custom-runtime",
            "--win-menu",
            "--win-shortcut",
            "--win-dir-chooser"
          )
          & jpackage @jpackageArgs

      - name: Package Native Installer with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          JAR_FILE=$(basename $(ls target/lexibangla-*-all.jar | head -n 1))
          rm -rf target/package-input
          mkdir -p target/package-input
          cp "target/$JAR_FILE" target/package-input/
          jpackage \
            --type deb \
            --dest dist \
            --name "LexiBangla" \
            --app-version "1.0.0" \
            --vendor "OriginSD" \
            --copyright "© 2026 OriginSD" \
            --description "English-to-Bengali Offline Dictionary" \
            --icon src/main/resources/icons/lexibangla-logo.png \
            --input target/package-input \
            --main-jar "$JAR_FILE" \
            --main-class org.originsd.lexibangla.Launcher \
            --runtime-image target/custom-runtime \
            --linux-shortcut \
            --linux-menu-group "Education;Dictionary;"

      - name: Package Native Installer with jpackage (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          JAR_FILE=$(basename $(ls target/lexibangla-*-all.jar | head -n 1))
          rm -rf target/package-input
          mkdir -p target/package-input
          cp "target/$JAR_FILE" target/package-input/
          jpackage \
            --type dmg \
            --dest dist \
            --name "LexiBangla" \
            --app-version "1.0.0" \
            --vendor "OriginSD" \
            --copyright "© 2026 OriginSD" \
            --mac-package-name "LexiBangla" \
            --mac-package-identifier "org.originsd.lexibangla" \
            --input target/package-input \
            --main-jar "$JAR_FILE" \
            --main-class org.originsd.lexibangla.Launcher \
            --runtime-image target/custom-runtime

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-installer
          path: ${{ matrix.installer-glob }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-multi-os
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} + > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
