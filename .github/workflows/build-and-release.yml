name: Build and Package LexiBangla Desktop

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clean platform-specific JVM config on non-Windows
        if: runner.os != 'Windows'
        run: |
          if [ -f .mvn/jvm.config ]; then
            sed -i '/WINDOWS-ROOT/d' .mvn/jvm.config || rm -f .mvn/jvm.config
          fi

      - name: Run Maven Tests
        run: mvn test --batch-mode

  package-multi-os:
    name: Package Optimized Native Binary (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg-type: exe
            artifact-name: LexiBangla-Windows
            installer-glob: dist/*.exe
          - os: ubuntu-latest
            pkg-type: deb,rpm
            artifact-name: LexiBangla-Linux
            installer-glob: |
              dist/*.deb
              dist/*.rpm
          - os: macos-latest
            pkg-type: dmg
            artifact-name: LexiBangla-macOS
            installer-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clean platform-specific JVM config on non-Windows
        if: runner.os != 'Windows'
        run: |
          if [ -f .mvn/jvm.config ]; then
            sed -i '/WINDOWS-ROOT/d' .mvn/jvm.config || rm -f .mvn/jvm.config
          fi

      - name: Package Native Windows Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/package-windows.ps1

      - name: Install RPM Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Package Native Linux Installers
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh
          bash scripts/package-linux.sh

      - name: Package Native macOS Installer
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package-mac.sh
          bash scripts/package-mac.sh

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-installer
          path: ${{ matrix.installer-glob }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-multi-os
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} + > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
